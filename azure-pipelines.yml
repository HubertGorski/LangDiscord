name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'

parameters:
- name: runTests
  displayName: 'Run Tests?'
  type: boolean
  default: true
- name: operation
  displayName: 'Deployment Operation'
  type: string
  default: 'Reinstall'
  values:
  - 'Install'
  - 'Uninstall'
  - 'Reinstall'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET Application'
    pool:
      name: 'Discord'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        version: $(dotnetVersion)
    
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
    
    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      env:
       DISCORD_TOKEN: $(DiscordToken)
       DETECTLANG_API_KEY: $(DetectLangApiKey)
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration) --no-restore'
        projects: '**/*.csproj'

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  condition: and(succeeded(), eq(${{ parameters.runTests }}, true))
  jobs:
  - job: TestJob
    displayName: 'Run Unit Tests'
    pool:
      name: 'Discord'
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'
        projects: '**/*Tests.csproj'
    
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

- stage: Deploy
  displayName: 'Deployment Stage'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Deploy Application'
    pool:
      name: 'Discord'
    steps:
    - powershell: |
        $operation = "${{ parameters.operation }}"
        Write-Host "Executing operation: $operation"
        
        
        if ($operation -eq "Install") {
          Write-Host "Installing application..."
        }
        elseif ($operation -eq "Uninstall") {
          Write-Host "Uninstalling application..."
        }
        elseif ($operation -eq "Reinstall") {
          Write-Host "Reinstalling application..."
        }
      displayName: 'Execute Deployment Operation'