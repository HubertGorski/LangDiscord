name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

parameters:
  - name: buildImage
    type: boolean
    default: true
    displayName: 'Build Docker image?'

  - name: deploymentAction
    type: string
    default: 'Reinstall'
    values:
      - Install
      - Uninstall
      - Reinstall
    displayName: 'Deployment operation'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  imageName: 'langdiscord'
  imageTag: 'latest'

stages:

# ---------- STAGE: TEST ----------
- stage: Test
  displayName: 'Stage: Test'
  jobs:
    - job: TestJob
      displayName: 'Tests and Linter'
      pool:
        name: 'Discord'
      steps:
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            version: $(dotnetVersion)

        - script: |
            dotnet tool restore
            dotnet format LangDiscord/LangDiscord.csproj --verify-no-changes
          displayName: 'Check code formatting (linter)'

        - script: |
            echo {} > LangDiscord/appsettings.local.json
            echo {} > LangDiscord/appsettings.secret.local.json
          displayName: 'Create empty config files'

        - script: |
            dotnet restore LangDiscord.Tests/LangDiscord.Tests.csproj
            dotnet build LangDiscord.Tests/LangDiscord.Tests.csproj --configuration $(buildConfiguration) --no-restore
            dotnet test LangDiscord.Tests/LangDiscord.Tests.csproj --configuration $(buildConfiguration) --no-build --verbosity normal
          displayName: 'Unit tests'

# ---------- STAGE: BUILD ----------
- stage: Build
  displayName: 'Stage: Build'
  dependsOn: Test
  condition: and(succeeded(), eq('${{ parameters.buildImage }}', true))
  jobs:
    - job: BuildJob
      displayName: 'Build Docker image'
      pool:
        name: 'Discord'
      steps:
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            version: $(dotnetVersion)

        - script: |
            docker build -t "$(imageName):$(imageTag)" .
          displayName: 'Build Docker image'

# ---------- STAGE: DEPLOY ----------
- stage: Deploy
  displayName: 'Stage: Deploy'
  dependsOn:
    - Test
    - Build
  condition: succeeded('Test')
  jobs:
    - job: DeployJob
      displayName: 'Application deployment'
      pool:
        name: 'Discord'
      steps:
        - task: DownloadSecureFile@1
          name: downloadSecretFile
          inputs:
            secureFile: appsettings.secret.local.json
          displayName: 'Download appsettings.secret.local.json from Secure Files'

        - task: DownloadSecureFile@1
          name: downloadLocalFile
          inputs:
            secureFile: appsettings.local.json
          displayName: 'Download appsettings.local.json from Secure Files'

        - script: |
            cp "$(downloadSecretFile.secureFilePath)" LangDiscord/appsettings.secret.local.json
            cp "$(downloadLocalFile.secureFilePath)" LangDiscord/appsettings.local.json
          displayName: 'Copy config files to project'

        - powershell: |
            $operation = '${{ parameters.deploymentAction }}'
            Write-Host "Selected operation: $operation"

            $image = "$(imageName):$(imageTag)"

            function ContainerExists {
              $exists = docker ps -a --format "{{.Names}}" | Where-Object { $_ -eq "langdiscord" }
              return $exists -ne $null
            }

            if ($operation -eq "Install") {
              if (-not (ContainerExists)) {
                Write-Host "Installing new container."
                docker run -d --name langdiscord -p 8080:80 -v "$(Build.SourcesDirectory)\LangDiscord\appsettings.secret.local.json:/app/appsettings.secret.local.json" -v "$(Build.SourcesDirectory)\LangDiscord\appsettings.local.json:/app/appsettings.local.json" $image
              }
              else {
                Write-Host "Container already exists, doing nothing."
              }
            }
            elseif ($operation -eq "Uninstall") {
              if (ContainerExists) {
                Write-Host "Removing container."
                try {
                  docker rm -f langdiscord
                }
                catch {
                  Write-Host "Failed to remove container."
                  throw
                }
              }
              else {
                Write-Host "Container does not exist, nothing to remove."
              }
            }
            elseif ($operation -eq "Reinstall") {
              if (ContainerExists) {
                Write-Host "Removing existing container."
                try {
                  docker rm -f langdiscord
                }
                catch {
                  Write-Host "Failed to remove container."
                  throw
                }
              }
              Write-Host "Starting new container."
              docker run -d --name langdiscord -p 8080:80 -v "$(Build.SourcesDirectory)\LangDiscord\appsettings.secret.local.json:/app/appsettings.secret.local.json" -v "$(Build.SourcesDirectory)\LangDiscord\appsettings.local.json:/app/appsettings.local.json" $image
            }
          displayName: 'Docker run - start application'
          env:
            DISCORD_TOKEN: $(DiscordToken)
            DETECTLANG_API_KEY: $(DetectLangApiKey)
