name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

parameters:
  - name: buildImage
    type: boolean
    default: true
    displayName: 'Czy budowaæ obraz Dockera?'

  - name: deploymentAction
    type: string
    default: 'Reinstall'
    values:
      - Install
      - Uninstall
      - Reinstall
    displayName: 'Operacja deploymentu'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  imageName: 'langdiscord'
  imageTag: 'latest'
  DiscordToken: $(DiscordToken)
  DetectLangApiKey: $(DetectLangApiKey)

stages:

# ---------- STAGE: TEST ----------
- stage: Test
  displayName: 'Etap: Test'
  jobs:
    - job: TestJob
      displayName: 'Testy i Linter'
      pool:
        name: 'Discord'
      steps:
        - task: UseDotNet@2
          displayName: 'Zainstaluj .NET SDK'
          inputs:
            version: $(dotnetVersion)

        - script: |
            dotnet tool restore
            dotnet format LangDiscord/LangDiscord.csproj --verify-no-changes
          displayName: 'SprawdŸ formatowanie kodu (linter)'

        - script: |
            echo {} > LangDiscord/appsettings.local.json
            echo {} > LangDiscord/appsettings.secret.local.json
          displayName: 'Utwórz puste pliki konfiguracyjne'

        - script: |
            dotnet restore LangDiscord.Tests/LangDiscord.Tests.csproj
            dotnet build LangDiscord.Tests/LangDiscord.Tests.csproj --configuration $(buildConfiguration) --no-restore
            dotnet test LangDiscord.Tests/LangDiscord.Tests.csproj --configuration $(buildConfiguration) --no-build --verbosity normal
          displayName: 'Testy jednostkowe'

# ---------- STAGE: BUILD ----------
- stage: Build
  displayName: 'Etap: Build'
  dependsOn: Test
  condition: and(succeeded(), eq('${{ parameters.buildImage }}', true))
  jobs:
    - job: BuildJob
      displayName: 'Budowanie obrazu Docker'
      pool:
        name: 'Discord'
      steps:
        - task: UseDotNet@2
          displayName: 'Zainstaluj .NET SDK'
          inputs:
            version: $(dotnetVersion)

        - script: |
            docker build -t "$(imageName):$(imageTag)" .
          displayName: 'Zbuduj obraz Dockera'

# ---------- STAGE: DEPLOY ----------
- stage: Deploy
  displayName: 'Etap: Deploy'
  dependsOn:
    - Test
    - Build
  condition: succeeded('Test')
  jobs:
  - job: DockerDeployment
    steps:
    - bash: |
        set -e

        operation="$(deploymentAction)"
        echo "Wybrana operacja: $operation"

        image="${imageName}:${imageTag}"
        container_name="langdiscord"

        container_exists=$(docker ps -a --format '{{.Names}}' | grep -w "$container_name" || true)

        if [[ "$operation" == "Install" ]]; then
          if [[ -z "$container_exists" ]]; then
            echo "Instalujê nowy kontener."
            docker run -d --name "$container_name" -p 8080:80 \
              -v "$(Build.SourcesDirectory)/LangDiscord/appsettings.secret.local.json:/app/appsettings.secret.local.json" \
              "$image"
          else
            echo "Kontener ju¿ istnieje, nic nie robiê."
          fi

        elif [[ "$operation" == "Uninstall" ]]; then
          if [[ -n "$container_exists" ]]; then
            echo "Usuwam kontener."
            docker rm -f "$container_name"
          else
            echo "Kontener nie istnieje, nic do usuniêcia."
          fi

        elif [[ "$operation" == "Reinstall" ]]; then
          if [[ -n "$container_exists" ]]; then
            echo "Usuwam istniej¹cy kontener."
            docker rm -f "$container_name"
          fi
          echo "Uruchamiam nowy kontener."
          docker run -d --name "$container_name" -p 8080:80 \
            -e DiscordToken="$(DiscordToken)" \
            -e DetectLangApiKey="$(DetectLangApiKey)" \
            "$image"
        else
          echo "Nieznana operacja: $operation"
          exit 1
        fi
      displayName: 'Zarz¹dzanie kontenerem Dockera'
      shell: bash