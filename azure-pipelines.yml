name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

parameters:
  - name: buildImage
    type: boolean
    default: true
    displayName: 'Czy budowaæ obraz Dockera?'

  - name: deploymentAction
    type: string
    default: 'Reinstall'
    values:
      - Install
      - Uninstall
      - Reinstall
    displayName: 'Operacja deploymentu'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  imageName: 'langdiscord'
  imageTag: 'latest'

stages:

# ---------- STAGE: TEST ----------
- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  condition: and(succeeded(), eq(${{ parameters.runTests }}, true))
  jobs:
  - job: TestJob
    displayName: 'Run Unit Tests'
    pool:
      name: 'Discord'
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Build Tests'
      inputs:
        command: 'build'
        projects: 'LangDiscordTests/**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'
    
    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: 'LangDiscordTests/**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger "trx"'
    
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: 'LangDiscordTests/TestResults/**/*.trx'
    
    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

# ---------- STAGE: BUILD ----------
- stage: Build
  displayName: 'Etap: Build'
  dependsOn: Test
  condition: and(succeeded(), eq('${{ parameters.buildImage }}', true))
  jobs:
    - job: BuildJob
      displayName: 'Budowanie obrazu Docker'
      pool:
        name: 'Discord'
      steps:
        - task: UseDotNet@2
          displayName: 'Zainstaluj .NET SDK'
          inputs:
            version: $(dotnetVersion)

        - script: |
            docker build -t $(imageName):$(imageTag) .
          displayName: 'Zbuduj obraz Dockera'

# ---------- STAGE: DEPLOY ----------
- stage: Deploy
  displayName: 'Etap: Deploy'
  dependsOn:
    - Test
    - Build
  condition: succeeded('Test')
  jobs:
    - job: DeployJob
      displayName: 'Wdro¿enie aplikacji'
      pool:
        name: 'Discord'
      steps:
        - powershell: |
            $operation = '${{ parameters.deploymentAction }}'
            Write-Host "Wybrana operacja: $operation"

            $image = "$(imageName):$(imageTag)"

            if ($operation -eq "Install") {
              docker run -d --name langdiscord -p 8080:80 $image
            }
            elseif ($operation -eq "Uninstall") {
              docker rm -f langdiscord
            }
            elseif ($operation -eq "Reinstall") {
              docker rm -f langdiscord || Write-Host "Nie by³o dzia³aj¹cego kontenera"
              docker run -d --name langdiscord -p 8080:80 $image
            }
          displayName: 'Docker run - uruchomienie aplikacji'
          env:
            DISCORD_TOKEN: $(DiscordToken)
            DETECTLANG_API_KEY: $(DetectLangApiKey)
